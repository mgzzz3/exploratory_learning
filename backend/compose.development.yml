services:
  mysql-dev:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: development-password
      MYSQL_DATABASE: ai_school_dev
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pdevelopment-password"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - mysql_dev_data:/var/lib/mysql

volumes:
  mysql_dev_data:
